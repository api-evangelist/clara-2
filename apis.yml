aid: clara-2
name: Clara 2
description: >-
  Clara is an AI-powered primary care and longevity practice, founded by the
  team behind Circle Medical and backed by Y Combinator (Spring 2026) and
  A.Capital. Clara pairs deep clinical AI with board-certified clinician review:
  it securely imports and analyzes a patient's medical records, surfaces health
  trends, assists with symptom assessment, medication refills, lab ordering, and
  longevity/biomarker goals, and routes every medical recommendation to a
  licensed clinician for review and approval before it reaches the patient. The
  company operates as a fully licensed primary care practice across all 50 U.S.
  states and is a HIPAA-covered entity. Clara is a consumer telehealth product
  (subscription plans on askclara.com) and currently publishes no public
  developer API, developer portal, or SDKs; this profile captures its public
  identity, trust, and compliance surface for the API Evangelist network.
